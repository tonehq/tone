apiVersion: v1
kind: Service
metadata:
  name: staging-tts-qwen-service
  namespace: staging
  labels:
    app: staging-tts-qwen
spec:
  type: ClusterIP
  # Selects the SAME pod as STT (the TTS container is a sidecar in it),
  # but routes to the TTS container's port.
  selector:
    app: staging-stt-nemotron
  ports:
    - name: tts
      port: 80
      targetPort: tts          # -> container 8001 (/health, /tts, /ws/tts)
