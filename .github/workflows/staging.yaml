name: Staging CI/CD

on:
  push:
    branches: ["staging"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/tonehq/tone:staging-latest
            ghcr.io/tonehq/tone:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/tonehq/tone:staging-buildcache
          cache-to: type=registry,ref=ghcr.io/tonehq/tone:staging-buildcache,mode=max
          secrets: |
            pip_extra_index=${{ secrets.PIP_EXTRA_INDEX_URL }}

      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.STAGING_KUBE_CONFIG_JSON }}

      - name: Create namespace
        run: kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Substitute IMAGE_TAG in deployment manifests
        run: |
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/staging/api/deployment.yaml
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/staging/call/inbound-call-worker.yaml
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/staging/call/outbound-call-worker.yaml
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/staging/worker/doc-worker.yaml
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/staging/worker/orchestrator.yaml

      - name: Apply all manifests
        run: |
          kubectl apply -f build/kubernetes/staging/letsencrypt-prod.yaml
          kubectl apply -f build/kubernetes/staging/api/service.yaml
          kubectl apply -f build/kubernetes/staging/api/deployment.yaml
          kubectl apply -f build/kubernetes/staging/api/certificate.yaml
          kubectl apply -f build/kubernetes/staging/api/ingress.yaml
          kubectl apply -f build/kubernetes/staging/call/pdb.yaml
          kubectl apply -f build/kubernetes/staging/call/service.yaml
          kubectl apply -f build/kubernetes/staging/call/inbound-call-worker.yaml
          kubectl apply -f build/kubernetes/staging/call/outbound-call-worker.yaml
          kubectl apply -f build/kubernetes/staging/call/certificate.yaml
          kubectl apply -f build/kubernetes/staging/call/ingress.yaml
          kubectl apply -f build/kubernetes/staging/call/pod-routing.yaml
          kubectl apply -f build/kubernetes/staging/worker/rbac.yaml
          kubectl apply -f build/kubernetes/staging/worker/doc-worker.yaml
          kubectl apply -f build/kubernetes/staging/worker/orchestrator.yaml
          kubectl apply -f build/kubernetes/staging/keda/trigger-auth.yaml
          kubectl apply -f build/kubernetes/staging/keda/scaledobjects.yaml

      - name: Rollout restart deployments
        run: |
          kubectl rollout restart deployment/staging-tone-api-deployment -n staging
          kubectl rollout restart statefulset/staging-tone-call-worker -n staging
          kubectl rollout restart statefulset/staging-tone-outbound-call-worker -n staging
          kubectl rollout restart deployment/staging-tone-worker -n staging
          kubectl rollout restart deployment/staging-tone-orchestrator -n staging

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/staging-tone-api-deployment -n staging --timeout=180s
          kubectl rollout status statefulset/staging-tone-call-worker -n staging --timeout=180s
          kubectl rollout status statefulset/staging-tone-outbound-call-worker -n staging --timeout=420s
          kubectl rollout status deployment/staging-tone-worker -n staging --timeout=180s
          kubectl rollout status deployment/staging-tone-orchestrator -n staging --timeout=180s
