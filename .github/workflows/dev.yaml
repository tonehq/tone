name: Dev CI/CD

on:
  push:
    branches: ["dev"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            developer390/tone:latest
            developer390/tone:${{ github.sha }}
          cache-from: type=registry,ref=developer390/tone:buildcache
          cache-to: type=registry,ref=developer390/tone:buildcache,mode=max

      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_JSON }}

      - name: Create namespace
        run: kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Substitute IMAGE_TAG in deployment manifests
        run: |
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/dev/deployment.yaml
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/dev/call-deployment.yaml

      - name: Apply all manifests
        run: |
          kubectl apply -f build/kubernetes/dev/service.yaml
          kubectl apply -f build/kubernetes/dev/deployment.yaml
          kubectl apply -f build/kubernetes/dev/ingress.yaml
          kubectl apply -f build/kubernetes/dev/call-pdb.yaml
          kubectl apply -f build/kubernetes/dev/call-service.yaml
          kubectl apply -f build/kubernetes/dev/call-deployment.yaml
          kubectl apply -f build/kubernetes/dev/call-ingress.yaml
          kubectl apply -f build/kubernetes/dev/call-certificate.yaml
          kubectl apply -f build/kubernetes/dev/letsencrypt-prod.yaml
          kubectl apply -f build/kubernetes/dev/certificate.yaml

      - name: Rollout restart deployments
        run: |
          kubectl rollout restart deployment/tone-api-deployment -n dev
          kubectl rollout restart deployment/tone-call-worker -n dev

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/tone-api-deployment -n dev --timeout=180s
          kubectl rollout status deployment/tone-call-worker -n dev --timeout=180s
