name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'frontend/src/**'
      - 'frontend/e2e/**'

jobs:
  review:
    if: false  # Disabled – remove this line to re-enable
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run code review
        run: python frontend/scripts/pr_code_review.py --pr ${{ github.event.pull_request.number }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
