name: Staging STT (Nemotron) Deploy

on:
  push:
    branches: ["staging"]
    paths:
      - "nemotron-streaming/**"
  workflow_dispatch:

env:
  NAMESPACE: staging
  DEPLOYMENT: staging-stt-nemotron-deployment
  CONFIGMAP: stt-nemotron-app

jobs:
  deploy-stt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.STAGING_KUBE_CONFIG_JSON }}

      - name: Update STT app ConfigMap
        run: |
          kubectl -n "$NAMESPACE" create configmap "$CONFIGMAP" \
            --from-file=server.py=nemotron-streaming/app/server.py \
            --from-file=requirements.txt=nemotron-streaming/app/requirements.txt \
            --from-file=constraints.txt=nemotron-streaming/app/constraints.txt \
            --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -

      # The shared deployment now mounts the TTS sidecar's configmap. Ensure it
      # exists so an STT-only deploy doesn't leave the pod stuck on a missing volume.
      - name: Ensure TTS app ConfigMap exists
        run: |
          kubectl -n "$NAMESPACE" create configmap qwen-tts-app \
            --from-file=server.py=qwen-tts-streaming/app/server.py \
            --from-file=requirements.txt=qwen-tts-streaming/app/requirements.txt \
            --from-file=constraints.txt=qwen-tts-streaming/app/constraints.txt \
            --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -

      - name: Apply deployment manifests
        run: |
          kubectl -n "$NAMESPACE" apply -f nemotron-streaming/k8s/staging/service.yaml
          kubectl -n "$NAMESPACE" apply -f nemotron-streaming/k8s/staging/deployment.yaml
          kubectl -n "$NAMESPACE" apply -f nemotron-streaming/k8s/staging/ingress.yaml

      - name: Restart and wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout restart deploy/"$DEPLOYMENT"
          kubectl -n "$NAMESPACE" rollout status deploy/"$DEPLOYMENT" --timeout=900s
