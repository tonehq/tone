name: Staging AWS EKS CI/CD

on:
  push:
    branches: ["staging-aws"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: tone-staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/tonehq/tone:staging-aws-latest
            ghcr.io/tonehq/tone:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/tonehq/tone:staging-buildcache
          cache-to: type=registry,ref=ghcr.io/tonehq/tone:staging-buildcache,mode=max
          secrets: |
            pip_extra_index=${{ secrets.PIP_EXTRA_INDEX_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Create namespace
        run: kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Create monitoring namespace
        run: kubectl apply -f build/kubernetes/staging-aws/monitoring/namespace.yaml

      - name: Create Grafana Cloud credentials secret
        run: |
          kubectl create secret generic grafana-cloud-credentials \
            --namespace=monitoring \
            --from-literal=loki-url="${{ secrets.GRAFANA_LOKI_URL }}" \
            --from-literal=loki-user="${{ secrets.GRAFANA_LOKI_USER }}" \
            --from-literal=prom-url="${{ secrets.GRAFANA_PROM_URL }}" \
            --from-literal=prom-user="${{ secrets.GRAFANA_PROM_USER }}" \
            --from-literal=api-key="${{ secrets.GRAFANA_CLOUD_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Substitute IMAGE_TAG in deployment manifests
        run: |
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/staging-aws/api/deployment.yaml
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/staging-aws/call/inbound-call-worker.yaml
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/staging-aws/call/outbound-call-worker.yaml
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/staging-aws/worker/doc-worker.yaml
          sed -i "s|\${IMAGE_TAG}|${{ github.sha }}|g" build/kubernetes/staging-aws/worker/orchestrator.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f build/kubernetes/staging-aws/api/service.yaml
          kubectl apply -f build/kubernetes/staging-aws/api/deployment.yaml
          kubectl apply -f build/kubernetes/staging-aws/api/ingress.yaml
          kubectl apply -f build/kubernetes/staging-aws/call/pdb.yaml
          kubectl apply -f build/kubernetes/staging-aws/call/service.yaml
          kubectl apply -f build/kubernetes/staging-aws/call/inbound-call-worker.yaml
          kubectl apply -f build/kubernetes/staging-aws/call/outbound-call-worker.yaml
          kubectl apply -f build/kubernetes/staging-aws/call/pod-routing.yaml
          kubectl apply -f build/kubernetes/staging-aws/call/ingress.yaml
          kubectl apply -f build/kubernetes/staging-aws/worker/rbac.yaml
          kubectl apply -f build/kubernetes/staging-aws/worker/doc-worker.yaml
          kubectl apply -f build/kubernetes/staging-aws/worker/orchestrator.yaml
          kubectl apply -f build/kubernetes/staging-aws/monitoring/rbac.yaml
          kubectl apply -f build/kubernetes/staging-aws/keda/trigger-auth.yaml
          kubectl apply -f build/kubernetes/staging-aws/keda/scaledobjects.yaml
          kubectl apply -f build/kubernetes/staging-aws/monitoring/configmap.yaml
          kubectl apply -f build/kubernetes/staging-aws/monitoring/daemonset.yaml

      - name: Rollout restart deployments
        run: |
          kubectl rollout restart deployment/tone-api -n staging
          kubectl rollout restart statefulset/tone-inbound-call-worker -n staging
          kubectl rollout restart statefulset/tone-outbound-call-worker -n staging
          kubectl rollout restart deployment/tone-worker -n staging
          kubectl rollout restart deployment/tone-orchestrator -n staging

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/tone-api -n staging --timeout=180s
          kubectl rollout status statefulset/tone-inbound-call-worker -n staging --timeout=180s
          kubectl rollout status statefulset/tone-outbound-call-worker -n staging --timeout=420s
          kubectl rollout status deployment/tone-worker -n staging --timeout=180s
          kubectl rollout status deployment/tone-orchestrator -n staging --timeout=180s
