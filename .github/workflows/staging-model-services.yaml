name: Staging Model Services Deploy

on:
  push:
    branches: ["staging"]
    paths:
      - "build/kubernetes/stt/**"
      - "build/kubernetes/tts/**"
      - "models/stt/**"
      - "models/tts/**"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - gemma
          - voxtral
          - nemotron
          - granite
          - parakeet
          - qwen
          - chatterbox

env:
  NAMESPACE: staging

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      gemma: ${{ steps.f.outputs.gemma }}
      voxtral: ${{ steps.f.outputs.voxtral }}
      nemotron: ${{ steps.f.outputs.nemotron }}
      granite: ${{ steps.f.outputs.granite }}
      parakeet: ${{ steps.f.outputs.parakeet }}
      qwen: ${{ steps.f.outputs.qwen }}
      chatterbox: ${{ steps.f.outputs.chatterbox }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=$(git rev-parse "${{ github.sha }}~1")
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "changed files:"; echo "$CHANGED"
          for m in gemma voxtral nemotron granite parakeet; do
            if echo "$CHANGED" | grep -qE "^(build/kubernetes/stt/$m/|models/stt/$m/)"; then
              echo "$m=true" >> "$GITHUB_OUTPUT"; else echo "$m=false" >> "$GITHUB_OUTPUT"; fi
          done
          for m in qwen chatterbox; do
            if echo "$CHANGED" | grep -qE "^(build/kubernetes/tts/$m/|models/tts/$m/)"; then
              echo "$m=true" >> "$GITHUB_OUTPUT"; else echo "$m=false" >> "$GITHUB_OUTPUT"; fi
          done

  deploy:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: gemma
            changed: ${{ needs.detect.outputs.gemma }}
            deployment: staging-stt-gemma-deployment
            configmap: gemma-app
            app_dir: models/stt/gemma
            manifest_dir: build/kubernetes/stt/gemma
          - model: voxtral
            changed: ${{ needs.detect.outputs.voxtral }}
            deployment: staging-stt-voxtral-deployment
            configmap: voxtral-app
            app_dir: models/stt/voxtral
            manifest_dir: build/kubernetes/stt/voxtral
          - model: nemotron
            changed: ${{ needs.detect.outputs.nemotron }}
            deployment: staging-stt-nemotron-deployment
            configmap: stt-nemotron-app
            app_dir: models/stt/nemotron
            manifest_dir: build/kubernetes/stt/nemotron
          - model: granite
            changed: ${{ needs.detect.outputs.granite }}
            deployment: staging-stt-granite-deployment
            configmap: granite-app
            app_dir: models/stt/granite
            manifest_dir: build/kubernetes/stt/granite
          - model: parakeet
            changed: ${{ needs.detect.outputs.parakeet }}
            deployment: staging-stt-parakeet-deployment
            configmap: parakeet-app
            app_dir: models/stt/parakeet
            manifest_dir: build/kubernetes/stt/parakeet
          - model: qwen
            changed: ${{ needs.detect.outputs.qwen }}
            deployment: staging-tts-qwen-deployment
            configmap: qwen-tts-app
            app_dir: models/tts/qwen
            manifest_dir: build/kubernetes/tts/qwen
          - model: chatterbox
            changed: ${{ needs.detect.outputs.chatterbox }}
            deployment: staging-tts-chatterbox-deployment
            configmap: chatterbox-app
            app_dir: models/tts/chatterbox
            manifest_dir: build/kubernetes/tts/chatterbox
    steps:
      - name: Should deploy
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.model }}" = "all" ] || [ "${{ github.event.inputs.model }}" = "${{ matrix.model }}" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ matrix.changed }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: azure/k8s-set-context@v4
        if: steps.gate.outputs.run == 'true'
        with:
          kubeconfig: ${{ secrets.STAGING_KUBE_CONFIG_JSON }}

      - name: Update app ConfigMap
        if: steps.gate.outputs.run == 'true'
        run: |
          ARGS=""
          for f in "${{ matrix.app_dir }}"/*; do
            [ -f "$f" ] && ARGS="$ARGS --from-file=$(basename "$f")=$f"
          done
          kubectl -n "$NAMESPACE" create configmap "${{ matrix.configmap }}" $ARGS \
            --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -

      - name: Apply manifests
        if: steps.gate.outputs.run == 'true'
        run: |
          kubectl -n "$NAMESPACE" apply -f "${{ matrix.manifest_dir }}/"

      - name: Restart and wait for rollout
        if: steps.gate.outputs.run == 'true'
        run: |
          kubectl -n "$NAMESPACE" rollout restart deploy/"${{ matrix.deployment }}"
          kubectl -n "$NAMESPACE" rollout status deploy/"${{ matrix.deployment }}" --timeout=1800s
