# STT — nvidia/nemotron-speech-streaming-en-0.6b (NeMo + FastAPI).
# Standalone: owns one GPU (nvidia.com/gpu: 1) on whichever GPU node the
# scheduler picks. TTS runs in its own deployment on the other GPU node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-stt-nemotron-deployment
  namespace: staging
  labels:
    app: staging-stt-nemotron
spec:
  replicas: 1
  # Startup is slow: the container pip-installs deps then downloads/loads the
  # NeMo model (the startupProbe allows up to 25 min). The default rollout
  # progress deadline is only 600s (10 min), so a healthy-but-slow start was
  # marked "exceeded its progress deadline" and failed the deploy. Give the
  # rollout longer than the startupProbe budget so a normal cold start passes.
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: staging-stt-nemotron
  template:
    metadata:
      labels:
        app: staging-stt-nemotron
    spec:
      # No nodeSelector needed: the `nvidia.com/gpu: 1` request below already
      # forces this onto a GPU node. Avoids depending on the manual `gpu-tier=8g`
      # label, which fresh pool nodes don't have (left STT Pending after a recycle).
      containers:
        - name: nemotron
          image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
          workingDir: /app
          command: ["bash", "-lc"]
          args:
            - |
              set -e
              pip install --no-cache-dir -c /app/constraints.txt -r /app/requirements.txt
              exec uvicorn server:app --host 0.0.0.0 --port 8000
          env:
            - name: STT_MODEL
              value: "nvidia/nemotron-speech-streaming-en-0.6b"
            # Decode granularity (ms). Bounds end-of-turn STT latency: only the
            # un-fed tail (< this) is decoded after the caller stops. Lower =
            # faster final transcript, more (cheap incremental) decodes. Was an
            # effective 1000ms; 320 cuts the end-of-turn tail ~3x. Tune here.
            - name: STT_STEP_MS
              value: "320"
            # End-of-turn "stable" fallback fires after STT_SILENCE_TICKS unchanged
            # decodes, i.e. after STT_STEP_MS * ticks of silence. Keep that window
            # ~2s (matches the old 1000ms*2) so a brief mid-sentence pause doesn't
            # split an utterance into two: 6 * 320ms ≈ 1920ms.
            - name: STT_SILENCE_TICKS
              value: "6"
            - name: HF_HOME
              value: /cache/hf
            - name: NEMO_CACHE_DIR
              value: /cache/nemo
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: app
              mountPath: /app
            - name: cache
              mountPath: /cache
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 150        # 25 min for pip + model download/load
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: app
          configMap:
            name: stt-nemotron-app
        - name: cache
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
