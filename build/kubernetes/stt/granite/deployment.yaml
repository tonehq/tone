apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-stt-granite-deployment
  namespace: staging
  labels:
    app: staging-stt-granite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: staging-stt-granite
  template:
    metadata:
      labels:
        app: staging-stt-granite
    spec:
      containers:
        - name: granite
          image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
          workingDir: /app
          command: ["bash", "-lc"]
          args:
            - |
              set -e
              pip install --no-cache-dir -c /app/constraints.txt -r /app/requirements.txt
              exec uvicorn server:app --host 0.0.0.0 --port 8000
          env:
            - name: HF_HOME
              value: /cache/hf
            - name: STT_MODEL
              value: "ibm-granite/granite-speech-3.3-2b"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: app
              mountPath: /app
            - name: cache
              mountPath: /cache
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: app
          configMap:
            name: granite-app
        - name: cache
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
