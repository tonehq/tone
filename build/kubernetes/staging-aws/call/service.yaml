apiVersion: v1
kind: Service
metadata:
  name: tone-inbound-call-service
  namespace: staging
  labels:
    app: tone-inbound-call-worker
    environment: staging
    component: call
spec:
  selector:
    app: tone-inbound-call-worker
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: tone-inbound-call-headless
  namespace: staging
  labels:
    app: tone-inbound-call-worker
    environment: staging
    component: call
spec:
  clusterIP: None
  selector:
    app: tone-inbound-call-worker
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
