apiVersion: v1
kind: Service
metadata:
  name: stt-nemotron-service
  namespace: staging
  labels:
    app: stt-nemotron
spec:
  selector:
    app: stt-nemotron
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
  type: ClusterIP
