apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-tts-cosyvoice-deployment
  namespace: staging
  labels:
    app: staging-tts-cosyvoice
spec:
  replicas: 1
  progressDeadlineSeconds: 2400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: staging-tts-cosyvoice
  template:
    metadata:
      labels:
        app: staging-tts-cosyvoice
    spec:
      nodeSelector:
        gpu: speech
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: cosyvoice
          image: neosun/cosyvoice:latest
          ports:
            - name: http
              containerPort: 8188
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: voices
              mountPath: /data/voices
            - name: dshm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: voices
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
