apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-tone-orchestrator
  namespace: staging
  labels:
    app: staging-tone-orchestrator
    environment: staging
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staging-tone-orchestrator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: staging-tone-orchestrator
        environment: staging
        component: worker
    spec:
      serviceAccountName: tone-worker
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 60
      containers:
        - name: staging-tone-orchestrator
          image: ghcr.io/tonehq/tone:${IMAGE_TAG}
          imagePullPolicy: Always
          command:
            - python
            - "-m"
            - procrastinate
            - "--app=core.services.ingestion_queue.app"
            - worker
            - "--name=$(POD_NAME)"
            - "--queues=pod_sync,outbound_calls,call_overlaps,call_transcripts,call_metrics,log_sync,contact_import"
            - "--concurrency=4"
            - "--no-listen-notify"
            - "--fetch-job-polling-interval=5"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: ENV
              value: "staging"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DEPLOYMENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['app']"
            - name: OMP_NUM_THREADS
              value: "2"
            - name: OPENBLAS_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            - name: INFISICAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infisical-credentials
                  key: token
            - name: INFISICAL_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: infisical-credentials
                  key: project_id
            - name: INFISICAL_HOST
              value: "https://secrets.trytone.ai"
      imagePullSecrets:
        - name: ghcr-auth
