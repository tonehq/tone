apiVersion: v1
kind: Service
metadata:
  name: ${RESOURCE_PREFIX}call-service
  namespace: ${NAMESPACE}
  labels:
    app: ${RESOURCE_PREFIX}call-worker
    environment: ${ENVIRONMENT}
    component: call
spec:
  selector:
    app: ${RESOURCE_PREFIX}call-worker
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ${RESOURCE_PREFIX}call-headless
  namespace: ${NAMESPACE}
  labels:
    app: ${RESOURCE_PREFIX}call-worker
    environment: ${ENVIRONMENT}
    component: call
spec:
  clusterIP: None
  selector:
    app: ${RESOURCE_PREFIX}call-worker
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
