apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ${RESOURCE_PREFIX}call-certificate
  namespace: ${NAMESPACE}
spec:
  secretName: ${RESOURCE_PREFIX}call-certificate
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: ${CALL_DOMAIN}
  dnsNames:
  - ${CALL_DOMAIN}
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
