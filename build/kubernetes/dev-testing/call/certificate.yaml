apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dev-testing-tone-call-certificate
  namespace: dev-testing
spec:
  secretName: dev-testing-tone-call-certificate
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: production-call.trytone.ai
  dnsNames:
  - production-call.trytone.ai
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
