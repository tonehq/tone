apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-testing-tone-api-deployment
  namespace: dev-testing
  labels:
    app: dev-testing-tone-api
    environment: dev-testing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dev-testing-tone-api
  template:
    metadata:
      labels:
        app: dev-testing-tone-api
        environment: dev-testing
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: dev-testing-tone-api
          image: developer390/tone:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "256m"
              memory: "1Gi"
          env:
            - name: ENV
              value: "dev-testing"
            - name: INFISICAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infisical-credentials
                  key: token
            - name: INFISICAL_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: infisical-credentials
                  key: project_id
            - name: INFISICAL_HOST
              value: "https://secrets.trytone.ai"
      imagePullSecrets:
        - name: dockerhub-auth
