apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: staging-tone-call-worker
  namespace: staging
  labels:
    app: staging-tone-call-worker
    environment: staging
    component: call
spec:
  serviceName: staging-tone-call-headless
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: staging-tone-call-worker
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: staging-tone-call-worker
        environment: staging
        component: call
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 2100
      containers:
        - name: staging-tone-call-worker
          image: developer390/tone:${IMAGE_TAG}
          imagePullPolicy: Always
          command:
            - uvicorn
            - "main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--workers"
            - "1"
            - "--timeout-keep-alive"
            - "3600"
            - "--log-level"
            - "info"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: ENV
              value: "staging"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DEPLOYMENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['app']"
            - name: WORKER_MODE
              value: "voice"
            - name: MAX_CONCURRENT_CALLS
              value: "5"
            - name: INFISICAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infisical-credentials
                  key: token
            - name: INFISICAL_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: infisical-credentials
                  key: project_id
            - name: INFISICAL_HOST
              value: "https://secrets.trytone.ai"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command:
                  - python
                  - -c
                  - |
                    import urllib.request, json, time
                    def call(path, method="GET"):
                        req = urllib.request.Request("http://localhost:8080" + path, method=method)
                        return json.load(urllib.request.urlopen(req, timeout=5))
                    try:
                        call("/drain", "POST")
                    except Exception:
                        pass
                    for _ in range(360):
                        try:
                            if call("/status").get("active_calls", 0) == 0:
                                break
                        except Exception:
                            pass
                        time.sleep(5)
      imagePullSecrets:
        - name: dockerhub-auth
