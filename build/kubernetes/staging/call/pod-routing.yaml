apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staging-tone-call-pod-ingress
  namespace: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging-call.trytone.ai
      secretName: staging-tone-call-certificate
  rules:
    - host: staging-call.trytone.ai
      http:
        paths:
          - path: /pod/0(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staging-tone-call-pod-0
                port:
                  number: 80
          - path: /pod/1(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staging-tone-call-pod-1
                port:
                  number: 80
          - path: /pod/2(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staging-tone-call-pod-2
                port:
                  number: 80
          - path: /pod/3(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staging-tone-call-pod-3
                port:
                  number: 80
          - path: /pod/4(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staging-tone-call-pod-4
                port:
                  number: 80
          - path: /pod/5(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staging-tone-call-pod-5
                port:
                  number: 80
          - path: /pod/6(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staging-tone-call-pod-6
                port:
                  number: 80
          - path: /pod/7(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staging-tone-call-pod-7
                port:
                  number: 80
          - path: /pod/8(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staging-tone-call-pod-8
                port:
                  number: 80
          - path: /pod/9(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staging-tone-call-pod-9
                port:
                  number: 80
