apiVersion: v1
kind: Service
metadata:
  name: staging-tone-call-service
  namespace: staging
  labels:
    app: staging-tone-call-worker
    environment: staging
    component: call
spec:
  selector:
    app: staging-tone-call-worker
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
