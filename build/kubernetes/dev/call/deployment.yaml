apiVersion: apps/v1
kind: Deployment
metadata:
  name: tone-call-worker
  namespace: dev
  labels:
    app: tone-call-worker
    component: call
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tone-call-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: tone-call-worker
        component: call
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 20
      containers:
        - name: tone-call-worker
          image: ghcr.io/tonehq/tone:${IMAGE_TAG}
          imagePullPolicy: Always
          command:
            - uvicorn
            - "main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--workers"
            - "1"
            - "--timeout-keep-alive"
            - "3600"
            - "--log-level"
            - "info"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          env:
            - name: ENV
              value: "dev"
            - name: WORKER_MODE
              value: "voice"
            - name: MAX_CONCURRENT_CALLS
              value: "5"
            - name: INFISICAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infisical-credentials
                  key: token
            - name: INFISICAL_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: infisical-credentials
                  key: project_id
            - name: INFISICAL_HOST
              value: "https://secrets.trytone.ai"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "curl -sf http://localhost:8080/drain || true && sleep 280"
      imagePullSecrets:
        - name: ghcr-auth
