apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: staging-gcp-kube-tone-call-certificate
  namespace: staging-gcp-kube
spec:
  secretName: staging-gcp-kube-tone-call-certificate
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: staging-gcp-kube-call.trytone.ai
  dnsNames:
  - staging-gcp-kube-call.trytone.ai
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
