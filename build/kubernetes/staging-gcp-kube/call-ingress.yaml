apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staging-gcp-kube-tone-call-ingress
  namespace: staging-gcp-kube
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS, PATCH"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization, X-Auth-Token, X-Org-Id, X-Tenant-Id, tenant_id, Accept, Origin, Referer, Sec-WebSocket-Extensions, Sec-WebSocket-Key, Sec-WebSocket-Protocol, Sec-WebSocket-Version"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length, Content-Range, Content-Type, X-Request-Id"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-max-age: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "staging-gcp-kube-tone-call-service"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging-gcp-kube-call.trytone.ai
      secretName: staging-gcp-kube-tone-call-certificate
  rules:
    - host: staging-gcp-kube-call.trytone.ai
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: staging-gcp-kube-tone-call-service
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: staging-gcp-kube-tone-call-service
                port:
                  number: 80
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: staging-gcp-kube-tone-call-service
                port:
                  number: 80
